<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raza Traders Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 600px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
    }
    canvas {
      border: 2px solid #ddd;
      border-radius: 10px;
      margin: 20px 0;
      max-width: 100%;
    }
    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s;
    }
    button:hover {
      background: #0284c7;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);
    }
    .info {
      background: #f0f9ff;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: left;
    }
    .info h3 {
      color: #0369a1;
      margin-top: 0;
    }
    .info ul {
      color: #0c4a6e;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Raza Traders Icon Generator</h1>
    <p>Generate app icons for PWA installation</p>
    
    <canvas id="canvas512" width="512" height="512"></canvas>
    <br>
    <button onclick="download512()">Download 512x512 Icon</button>
    <button onclick="download192()">Download 192x192 Icon</button>
    
    <div class="info">
      <h3>📋 Instructions:</h3>
      <ol>
        <li>Click "Download 512x512 Icon"</li>
        <li>Click "Download 192x192 Icon"</li>
        <li>Save both files to: <code>/public/icons/</code></li>
        <li>Rename them to:
          <ul>
            <li><code>icon-512x512.png</code></li>
            <li><code>icon-192x192.png</code></li>
          </ul>
        </li>
        <li>Deploy your app!</li>
      </ol>
    </div>
  </div>

  <script>
    // Generate 512x512 icon
    const canvas512 = document.getElementById('canvas512');
    const ctx512 = canvas512.getContext('2d');
    
    // Background gradient
    const gradient = ctx512.createLinearGradient(0, 0, 512, 512);
    gradient.addColorStop(0, '#0ea5e9');
    gradient.addColorStop(1, '#0284c7');
    ctx512.fillStyle = gradient;
    ctx512.fillRect(0, 0, 512, 512);
    
    // Circle background
    ctx512.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx512.beginPath();
    ctx512.arc(256, 256, 200, 0, Math.PI * 2);
    ctx512.fill();
    
    // Text "RT"
    ctx512.fillStyle = 'white';
    ctx512.font = 'bold 180px Arial, sans-serif';
    ctx512.textAlign = 'center';
    ctx512.textBaseline = 'middle';
    ctx512.fillText('RT', 256, 256);
    
    // Add shadow
    ctx512.shadowColor = 'rgba(0, 0, 0, 0.3)';
    ctx512.shadowBlur = 20;
    ctx512.shadowOffsetX = 5;
    ctx512.shadowOffsetY = 5;
    
    function download512() {
      canvas512.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'icon-512x512.png';
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }
    
    function download192() {
      // Create 192x192 version
      const canvas192 = document.createElement('canvas');
      canvas192.width = 192;
      canvas192.height = 192;
      const ctx192 = canvas192.getContext('2d');
      
      // Scale and draw
      ctx192.drawImage(canvas512, 0, 0, 192, 192);
      
      canvas192.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'icon-192x192.png';
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }
  </script>
</body>
</html>
